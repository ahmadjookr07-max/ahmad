name: Build Windows Setup 2.9.13

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_VERSION_FILE: VERSION

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.8.1 opencv-python-headless numpy onnxruntime openpyxl pillow pytesseract arabic-reshaper python-bidi dilithium-py cryptography zxing-cpp pyinstaller

      - name: Download ISNet model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/engine_v2/models | Out-Null
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx" -OutFile "src/engine_v2/models/isnet-general-use.onnx"
          if ((Get-Item src/engine_v2/models/isnet-general-use.onnx).Length -lt 100MB) { throw "ISNet model too small" }

      - name: Download legacy U2Net models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/models | Out-Null
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx" -OutFile "resources/models/u2net.onnx"
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx" -OutFile "resources/models/u2netp.onnx"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --distpath dist/windows --workpath build_tmp build/windows/AhmedAlFaifiMarketImageStudioV2.spec
          if (-not (Test-Path "dist/windows/AhmedAlFaifiMarketImageStudio/AhmedAlFaifiMarketImageStudio.exe")) { throw "EXE missing" }

      - name: Add portable Tesseract OCR (ara+eng)
        shell: pwsh
        run: |
          $dest = "dist/windows/AhmedAlFaifiMarketImageStudio/tesseract"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe" -OutFile tesseract-setup.exe
          # Extract installer payload with 7zip (bundled on runner)
          7z x tesseract-setup.exe -o"tess_extract" -y | Out-Null
          Copy-Item tess_extract/* $dest -Recurse -Force
          # Ensure Arabic + English traineddata
          $tessdata = Join-Path $dest "tessdata"
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata" -OutFile (Join-Path $tessdata "ara.traineddata")
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile (Join-Path $tessdata "eng.traineddata")
          if (-not (Test-Path (Join-Path $dest "tesseract.exe"))) { Write-Host "::warning::tesseract.exe not found after extract — OCR falls back gracefully" }

      - name: Smoke test frozen app (imports)
        shell: pwsh
        run: |
          $exe = "dist/windows/AhmedAlFaifiMarketImageStudio/AhmedAlFaifiMarketImageStudio.exe"
          # Launch and kill after 25s; a crash on startup exits immediately non-zero
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Frozen app stayed alive 25s — OK"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" build\windows\installer_v200.nsi
          if (-not (Test-Path "dist/installer/AhmedAlFaifiMarketImageStudio-Setup-2.9.13.exe")) { throw "Installer missing" }
          Get-Item dist/installer/*.exe | Format-List Name,Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setup-2.9.13
          path: dist/installer/AhmedAlFaifiMarketImageStudio-Setup-2.9.13.exe
          retention-days: 30

      - name: Upload portable app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portable-2.9.13
          path: dist/windows/AhmedAlFaifiMarketImageStudio
          retention-days: 7
