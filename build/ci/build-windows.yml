name: Build Windows Setup 2.9.5

on:
  workflow_dispatch:
    inputs:
      regenerate_owner_secrets:
        description: "توليد شفرة مالك جديدة (يبطل كل المفاتيح المُصدَرة سابقًا)"
        type: boolean
        default: false
  push:
    branches: [main]

env:
  APP_VERSION: "2.9.5"
  USER_APP_ID: "AhmedAlFaifiMarketImageStudio"
  OWNER_APP_ID: "AhmedAlFaifiOwnerStudio"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.8.1 opencv-python-headless numpy onnxruntime openpyxl pillow pytesseract arabic-reshaper python-bidi dilithium-py cryptography zxing-cpp pyinstaller

      # ---------------------------------------------------------------- الترخيص
      # شفرة المالك تبقى ثابتة افتراضيًا حتى لا تبطل مفاتيح العملاء الحالية.
      # التوليد الجديد يدويّ فقط عبر workflow_dispatch.
      - name: Regenerate owner secrets (manual only)
        if: ${{ inputs.regenerate_owner_secrets == true }}
        shell: pwsh
        run: |
          python tools/generate_owner_secrets.py --force
          Write-Host "::warning::شفرة مالك جديدة — كل المفاتيح المُصدَرة سابقًا صارت باطلة"

      - name: Verify owner-user license link
        shell: pwsh
        run: |
          $out = python tools/verify_owner_link.py 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "الربط بين برنامج المالك وبرنامج المستخدم مكسور — أوقف البناء" }

      # ------------------------------------------------------------- النماذج
      - name: Download ISNet model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/engine_v2/models | Out-Null
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx" -OutFile "src/engine_v2/models/isnet-general-use.onnx"
          if ((Get-Item src/engine_v2/models/isnet-general-use.onnx).Length -lt 100MB) { throw "ISNet model too small" }

      - name: Download legacy U2Net models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/models | Out-Null
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx" -OutFile "resources/models/u2net.onnx"
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx" -OutFile "resources/models/u2netp.onnx"

      # -------------------------------------------------- اختبارات قبل التحزيم
      - name: Run license and trial test suite
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src;windows_app;owner_studio;."
          $env:QT_QPA_PLATFORM = "offscreen"
          $failed = @()
          foreach ($t in @("test_license.py", "test_trial_and_link.py", "test_units.py")) {
            Write-Host "----- $t"
            python "tests/$t"
            if ($LASTEXITCODE -ne 0) { $failed += $t }
          }
          if ($failed.Count -gt 0) { throw "اختبارات فاشلة: $($failed -join ', ')" }

      # ------------------------------------------------------- بناء البرنامجين
      - name: Build user app (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --distpath dist/windows --workpath build_tmp build/windows/AhmedAlFaifiMarketImageStudioV2.spec
          if (-not (Test-Path "dist/windows/$env:USER_APP_ID/$env:USER_APP_ID.exe")) { throw "User EXE missing" }

      - name: Build owner app (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --distpath dist/windows --workpath build_tmp_owner build/windows/AhmedAlFaifiOwnerStudio.spec
          if (-not (Test-Path "dist/windows/$env:OWNER_APP_ID/$env:OWNER_APP_ID.exe")) { throw "Owner EXE missing" }

      - name: Add portable Tesseract OCR (ara+eng)
        shell: pwsh
        run: |
          $dest = "dist/windows/$env:USER_APP_ID/tesseract"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe" -OutFile tesseract-setup.exe
          7z x tesseract-setup.exe -o"tess_extract" -y | Out-Null
          Copy-Item tess_extract/* $dest -Recurse -Force
          $tessdata = Join-Path $dest "tessdata"
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata" -OutFile (Join-Path $tessdata "ara.traineddata")
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile (Join-Path $tessdata "eng.traineddata")
          if (-not (Test-Path (Join-Path $dest "tesseract.exe"))) { Write-Host "::warning::tesseract.exe not found after extract — OCR falls back gracefully" }

      # --------------------------------------------------------- فحوص التشغيل
      - name: Smoke test user app
        shell: pwsh
        run: |
          $exe = "dist/windows/$env:USER_APP_ID/$env:USER_APP_ID.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "User app exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "User app stayed alive 25s — OK"

      - name: Smoke test owner app
        shell: pwsh
        run: |
          $exe = "dist/windows/$env:OWNER_APP_ID/$env:OWNER_APP_ID.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Owner app exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Owner app stayed alive 20s — OK"

      # ------------------------------------------------------------- المثبّتات
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build user installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" build\windows\installer_v295.nsi
          $f = "dist/installer/$env:USER_APP_ID-Setup-$env:APP_VERSION.exe"
          if (-not (Test-Path $f)) { throw "User installer missing" }

      - name: Build owner installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" build\windows\installer_owner_v295.nsi
          $f = "dist/installer/$env:OWNER_APP_ID-Setup-$env:APP_VERSION.exe"
          if (-not (Test-Path $f)) { throw "Owner installer missing" }
          Get-Item dist/installer/*.exe | Format-List Name,Length

      # ------------------------------------------------------------- المخرجات
      - name: Upload user setup
        uses: actions/upload-artifact@v4
        with:
          name: Setup-User-2.9.5
          path: dist/installer/AhmedAlFaifiMarketImageStudio-Setup-2.9.5.exe
          retention-days: 90

      - name: Upload owner setup (confidential)
        uses: actions/upload-artifact@v4
        with:
          name: Setup-Owner-2.9.5-CONFIDENTIAL
          path: dist/installer/AhmedAlFaifiOwnerStudio-Setup-2.9.5.exe
          retention-days: 90

      - name: Upload portable user app
        uses: actions/upload-artifact@v4
        with:
          name: Portable-User-2.9.5
          path: dist/windows/AhmedAlFaifiMarketImageStudio
          retention-days: 7
